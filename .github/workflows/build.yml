name: Build SABAY-VPN Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gomobile

      - name: Build Android App (Debug)
        run: |
          cd make
          # Собираем в режиме debug, чтобы пропустить проверку официальных Keystore-подписей
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabay-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
