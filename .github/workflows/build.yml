name: Build SABAY-VPN Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App (Debug)
        run: |
          # Переходим в корень проекта, где лежит pubspec.yaml
          flutter pub get
          # Собираем APK в режиме debug без проверок Keystore подписей
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabay-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
